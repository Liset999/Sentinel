name: Sentinel CI/CD Pipeline

# 1. 触发条件：什么时候执行流水线？
on:
  push:
    branches: [ "main", "master" ] # 当有代码推送到主分支时
    tags: [ 'v*.*.*' ]             # 当打上 v1.0.0 这种 Tag 时
  pull_request:
    branches: [ "main", "master" ] # 当有人提 PR 时（只跑测试，不推镜像）

jobs:
  # ==========================================
  # 阶段一：持续集成 (Continuous Integration)
  # ==========================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # 根据你的项目实际版本调整
          cache: 'pip'          # 开启 pip 缓存，加速后续构建

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest # 确保安装了测试框架

      - name: 执行单元测试
        run: |
          # 这里假设你的测试代码在 tests 目录下
          pytest tests/ 

  # ==========================================
  # 阶段二：持续交付 (Continuous Deployment)
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test # 核心逻辑：必须等 test 阶段跑通了，才能打包镜像！
    runs-on: ubuntu-latest
    # 限制条件：如果是提 PR，只测试不打包；只有代码真正合入主分支，才触发发版
    if: github.event_name == 'push' 
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx (支持多架构构建和缓存)
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 自动生成镜像 Tag (基于 Git Commit 和 Release 标签)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sentinel

      - name: 构建并推送镜像 (Build and Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 工业级优化：开启 Docker 构建缓存，极大缩短后续打包时间
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel:buildcache,mode=max
