# prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 1. 告诉 Prometheus 规则文件在哪里
rule_files:
  - "/etc/prometheus/rules/processed_rules.yaml"

# 2. 告诉 Prometheus 如果出事了把消息发给谁
alerting:
  alertmanagers:
    - static_configs:
      - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'sentinel_monitor'
    static_configs:
      # 👇 修改这里：使用内部域名指向宿主机上的 exporter
      - targets: ['host.docker.internal:8000']