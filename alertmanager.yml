# alertmanager.yml
# Sentinel 项目最小告警配置

route:
  group_by: ['alertname']          # 按告警名称分组
  group_wait: 10s                  # 相同告警等待10秒再发
  group_interval: 5m               # 同一组告警每5分钟发一次
  repeat_interval: 1h              # 重复告警1小时后再提醒
  receiver: 'webhook'              # 默认发给 webhook 这个 receiver

receivers:
  - name: 'webhook'
    webhook_configs:
      - url: 'http://exporter:8000/webhook'   # 暂时调用 exporter 容器的 /webhook 接口（后面可以改成 snapshot）
        send_resolved: true                    # 问题恢复后也通知