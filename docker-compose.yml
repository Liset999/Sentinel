services:
  # 1. 自定义 Python 采集器
  exporter:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_exporter
    pid: "host"
    ports:
      - "8000:8000"
    volumes:
      - /proc:/host/proc:ro
      - ./rules:/app/rules:ro
    environment:
      - PROC_DIR=/host/proc
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    networks:
      - sentinel_net
    restart: unless-stopped

  # 1.5 规则热重载边车容器 (改为持续运行监听)
  rule_parser:
    image: python:3.9-alpine
    container_name: sentinel_rule_parser
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # 必须挂载整个目录，以便实时读取宿主机的 .env 变化
      - ./:/app:z
    working_dir: /app
    # 改为持续运行
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      # 新增 requests 依赖，并改为运行 watcher.py
      - "pip install --no-cache-dir PyYAML python-dotenv requests && python rules/watcher.py"
    networks:
      - sentinel_net

  # 2. Prometheus 服务
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:z
      - ./rules:/etc/prometheus/rules:z
      - prometheus_data:/prometheus
    # 恢复 Prometheus 默认的启动命令（去掉自定义的 entrypoint 和 command）
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    depends_on:
      exporter:
        condition: service_started
      # 关键点：由于 parser 现在是无限循环监听，所以改为等待它启动即可 (service_started)
      rule_parser:
        condition: service_started
    networks:
      - sentinel_net
    restart: unless-stopped

  # 3. Grafana 服务 (保持不变)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:z
    depends_on:
      - prometheus
    networks:
      - sentinel_net
    restart: unless-stopped

  # 4. alertmanager 告警 (保持不变)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/config.yml
    depends_on:
      - prometheus
    networks:
      - sentinel_net
    restart: unless-stopped

# 持久化卷和网络定义 (保持不变)
volumes:
  prometheus_data:
  grafana_data:

networks:
  sentinel_net:
    driver: bridge